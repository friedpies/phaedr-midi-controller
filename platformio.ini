; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy35]
platform = teensy
board = teensy35
framework = arduino
lib_deps =
	thomasfredericks/Bounce2@^2.70
	# SoftPWM is vendored locally in lib/SoftPWM/ with SOFTPWM_MAXCHANNELS=22
	# (increased from upstream default of 20 to support all 22 LED channels:
	#  K1-K14 grid LEDs + P1-P8 track LEDs = 22 SoftPWM channels required)
build_flags = -DUSB_MIDI_SERIAL
